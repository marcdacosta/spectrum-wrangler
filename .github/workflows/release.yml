# Publishes to PyPI through trusted publishing (OIDC): no API token is stored
# in the repository. PyPI must list this repository, this workflow file, and
# the `pypi` environment as the project's trusted publisher first.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Version and upload date recorded in docs/DEPENDENCIES.md.
      - run: python -m pip install build==1.5.0
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
